//example: https://github.com/GetStream/stream-chat-android/blob/main/scripts/publish-mavencentral.gradle
//worked with https://dev.to/kengotoda/deploying-to-ossrh-with-gradle-in-2020-1lhi

apply plugin: 'maven-publish'
apply plugin: 'signing'

def libVersion = LIB_VERSION // This is the library version used when deploying the artifact
def enableDeploy = ENABLE_DEPLOY //Flag whether the ci/cd workflow should deploy to sonatype or not

def libGroupId = LIB_GROUP_ID // Maven Group ID for the artifact
def libArtifactId = LIB_ARTIFACT_ID // Maven Artifact ID for the artifact
def libName = LIB_NAME // Library name
def siteUrl = SITE_URL // Homepage URL of the library
def gitUrl = GIT_URL // Git repository URL
def libDescription = LIB_DESCRIPTION // Library description

group = libGroupId
version = libVersion

// retrieve variables from system environmental variables
def sonatypeUser = enableDeploy ? System.getenv('SONATYPE_USER') : ''
def sonatypePwd = enableDeploy ? System.getenv('SONATYPE_PWD') : ''
def sonatypeGpgKey = enableDeploy ? System.getenv('SONATYPE_GPG_KEY') : ''
def sonatypeGpgPwd = enableDeploy ? System.getenv('SONATYPE_GPG_PWD') : ''
def sonatypeGpgPath = enableDeploy ? System.getenv('SONATYPE_GPG_PATH') : ''

// Namespace as shown in Central Portal
def sonatypeNamespace = 'io.github.stefanosiano'

// signing plugin config
ext["signing.keyId"] = sonatypeGpgKey
ext["signing.password"] = sonatypeGpgPwd
ext["signing.secretKeyRingFile"] = sonatypeGpgPath

task androidJavadocs(type: Javadoc) {
    excludes = ['**/*.kt']

    if (project.plugins.findPlugin("com.android.library")) {
        source = android.sourceSets.main.java.srcDirs
    } else {
        source = sourceSets.main.java.srcDirs
    }
}

task javadocJar(type: Jar, dependsOn: androidJavadocs) {
    archiveClassifier.set('javadoc')

    if (project.plugins.findPlugin("com.android.library")) {
        from androidJavadocs.destinationDir
    } else {
        from javadoc.destinationDir
    }
}

task sourcesJar(type: Jar) {
    archiveClassifier.set('sources')

    if (project.plugins.findPlugin("com.android.library")) {
        from android.sourceSets.main.java.srcDirs
        from android.sourceSets.main.kotlin.srcDirs
    } else {
        from sourceSets.main.java.srcDirs
        from sourceSets.main.kotlin.srcDirs
    }
}

artifacts {
    archives javadocJar, sourcesJar
}

// publish plugin config
publishing {
    repositories {
        // add sonatype repo as mavenCentral
        maven {
            name = "mavenCentral"

            def releasesRepoUrl =
                    "https://ossrh-staging-api.central.sonatype.com/service/local/staging/deploy/maven2/"
            def snapshotsRepoUrl =
                    "https://central.sonatype.com/repository/maven-snapshots/"

            url = version.toString().endsWith("SNAPSHOT")
                    ? snapshotsRepoUrl
                    : releasesRepoUrl

            credentials {
                username = sonatypeUser
                password = sonatypePwd
            }
        }
    }

    publications {
        release(MavenPublication) {
            if (!enableDeploy) return true

            groupId = libGroupId
            artifactId = libArtifactId
            version = libVersion

            // Add AAR/JAR to artifacts
            if (project.plugins.findPlugin("com.android.library")) {
                artifact(tasks.named("bundleReleaseAar"))
            } else {
                artifact(layout.buildDirectory.file(
                        "libs/${project.getName()}-${version}.jar"
                ))
            }

            artifact(javadocJar)
            artifact(sourcesJar)

            // pom file config
            pom {
                name = libName
                description = libDescription
                url = siteUrl

                licenses {
                    license {
                        name = 'MIT'
                        url = 'https://opensource.org/licenses/MIT'
                    }
                }

                developers {
                    developer {
                        id = 'stefanosiano'
                        name = 'Stefano Siano'
                        email = 'stefano.siano91@gmail.com'
                    }
                }

                scm {
                    connection = "scm:git:$gitUrl"
                    developerConnection = "scm:git:$gitUrl"
                    url = siteUrl
                }

                withXml {
                    def dependenciesNode = asNode().appendNode("dependencies")

                    project.configurations.implementation.allDependencies.each {
                        if (it.group == "" || it.name == "" || it.name == "unspecified") return

                        if (it.name.endsWith("-bom")) {
                            def dependencyNode =
                                    dependenciesManagementNode.appendNode("dependency")

                            dependencyNode.appendNode("groupId", it.group)
                            dependencyNode.appendNode("artifactId", it.name)
                            dependencyNode.appendNode("version", it.version)
                            dependencyNode.appendNode("scope", "import")
                            dependencyNode.appendNode("type", "pom")
                        } else {
                            def dependencyNode =
                                    dependenciesNode.appendNode("dependency")

                            dependencyNode.appendNode("groupId", it.group)
                            dependencyNode.appendNode("artifactId", it.name)

                            if (it.version != "") {
                                dependencyNode.appendNode("version", it.version)
                            }
                        }
                    }
                }
            }
        }
    }
}

signing {
    if (!enableDeploy) return true

    sign publishing.publications.release
}

if (enableDeploy && !version.toString().endsWith("SNAPSHOT")) {
    tasks.named("publish") {
        finalizedBy("publishToCentralPortal")
    }
}

// Gradle's built-in maven-publish plugin only uploads the files.
// It does not tell the OSSRH Staging API that the deployment is complete.
// This task uploads the completed deployment to the Central Publisher Portal.
task publishToMavenCentral {
    doLast {
        def token = "${sonatypeUser}:${sonatypePwd}"
        def encodedToken = token.getBytes("UTF-8").encodeBase64().toString()

        def url = new URL(
                "https://ossrh-staging-api.central.sonatype.com" +
                        "/manual/upload/defaultRepository/" +
                        sonatypeNamespace
        )

        println "Transferring deployment to Central Publisher Portal..."

        def connection = url.openConnection()

        connection.setRequestMethod("POST")
        connection.setDoOutput(true)

        connection.setRequestProperty(
                "Authorization",
                "Bearer ${encodedToken}"
        )

        connection.setRequestProperty(
                "Accept",
                "application/json"
        )

        connection.outputStream.close()

        def responseCode = connection.responseCode

        if (responseCode < 200 || responseCode >= 300) {
            def errorResponse = ""

            if (connection.errorStream != null) {
                errorResponse = connection.errorStream.getText("UTF-8")
            }

            throw new GradleException(
                    "Failed to transfer deployment to Central Publisher Portal. " +
                            "HTTP ${responseCode}: ${errorResponse}"
            )
        }

        println "Deployment successfully transferred to Central Publisher Portal."
        println "Open https://central.sonatype.com/publishing to review it."
    }
}